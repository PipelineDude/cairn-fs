[package]
name = "cairn-cdc"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Cairn content-defined chunking (FastCDC) + convergent dedup lookup + per-chunk encrypt/store pipeline."
license = "MIT"

[dependencies]
fastcdc = "3.1"
blake3 = "1.8.5"
tokio = { version = "1.32", features = ["full"] }
futures = "0.3"
cacache = "13"
anyhow = "1.0"
secrecy = "0.10.3"
zeroize = "1.9"
cairn-seal = { path = "../cairn-seal" }
cairn-index = { path = "../cairn-index" }
cairn-store = { path = "../cairn-store" }
opendal = { version = "0.58.1", features = ["services-s3", "services-gcs"], optional = true }
reed-solomon-erasure = { version = "6.0.0", optional = true }
tracing = "0.1.44"

[features]
# Mirrors the root crate's feature; unified up the tree. Pulls cairn-store's feature so
# CloudOperator resolves to the same opendal::Operator type everywhere.
cloud-storage = ["dep:opendal", "dep:reed-solomon-erasure", "cairn-store/cloud-storage"]

[dev-dependencies]
age = "0.11.3"
dashmap = "6.2.1"
tempfile = "3.27.0"
tokio-test = "0.4"
