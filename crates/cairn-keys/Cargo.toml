[package]
name = "cairn-keys"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Cairn key tooling: generate age X25519 keypairs and split/combine the master secret into Shamir shares."
license = "MIT"

# Bin name kept as `gen_keys` so existing scripts / `cargo run --bin gen_keys` still work.
[[bin]]
name = "gen_keys"
path = "src/main.rs"

[dependencies]
age = "0.11.3"
blahaj = "0.6.0"
libc = "0.2"
zeroize = "1.9.0"

[dev-dependencies]
tempfile = "3.27.0"
rand = "0.8"
