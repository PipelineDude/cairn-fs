[package]
name = "cairn-seal"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Cairn on-disk envelope format: age X25519 key-wrap + AES-256-GCM / ChaCha20-Poly1305 chunk encryption, compression, convergent/keyed dedup key derivation."
license = "MIT"

[dependencies]
aes-gcm = "0.10"
aes = { version = "0.8", features = ["zeroize"] }
chacha20poly1305 = "0.11.0"
age = "0.11.3"
zstd = "0.13"
lz4_flex = "0.13.1"
blake3 = "1.8.5"
zeroize = { version = "1", features = ["zeroize_derive"] }
secrecy = "0.10.3"
rand = "0.8"
hex = "0.4"
tracing = "0.1"
anyhow = "1.0"
parking_lot = "0.12"
lru = "0.18.0"

[dev-dependencies]
tempfile = "3.27.0"
age = "0.11"
